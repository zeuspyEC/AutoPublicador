<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="apple-touch-icon" href="../icono-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Consulta una placa de Ecuador: ficha del SRI, valores pendientes, historial de pagos y revisiones técnicas, verificados entre fuentes oficiales." />
    <title>Consulta de placas</title>
    <script>
      // Tema guardado, aplicado antes de pintar (sin destello blanco en modo oscuro)
      try {
        var t = JSON.parse(localStorage.getItem('ap.placas.tema') || '"sistema"'), r = document.documentElement
        if (t === 'claro' || t === 'oscuro') r.dataset.tema = t
        var oscuro = t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', oscuro ? '#0b1020' : '#1e3a8a')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/placas/main.tsx"></script>
  </body>
</html>
