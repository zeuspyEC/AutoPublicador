# Cada push a main: pruebas → compilación → publicación en GitHub Pages.
# Si una prueba falla, no se publica nada (el sitio sigue con la versión anterior).
name: Probar y desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas contra Wikipedia real
        run: npm run test:integracion
        continue-on-error: true # si Wikipedia no responde en ese momento, no bloquea la publicación
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
